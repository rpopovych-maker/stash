name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          export BUILD_NUMBER="${{ github.run_number }}"
          ./build.sh --release

      - uses: actions/upload-artifact@v4
        with:
          name: Stash
          path: |
            build/Stash.dmg
            build/Stash.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Stash.dmg build/Stash.zip --title "Stash $GITHUB_REF_NAME" --generate-notes
